<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 440 440">
  <defs>
    <!-- STOP -->
    <g id="stop">
      <polygon points="31.4,13 13,31.4 -13,31.4 -31.4,13 -31.4,-13 -13,-31.4 13,-31.4 31.4,-13" fill="#E5484D" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <text x="0" y="6.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17" fill="#fff" letter-spacing="0.5">STOP</text>
    </g>
    <!-- Опасность (!) -->
    <g id="warn">
      <polygon points="0,-30 30,22 -30,22" fill="#fff" stroke="#E5484D" stroke-width="7" stroke-linejoin="round"/>
      <rect x="-2.6" y="-11" width="5.2" height="20" rx="2.6" fill="#111"/>
      <circle cx="0" cy="14" r="3" fill="#111"/>
    </g>
    <!-- Ограничение скорости 60 -->
    <g id="speed">
      <circle r="30" fill="#fff" stroke="#E5484D" stroke-width="7"/>
      <text x="0" y="8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="23" fill="#111">60</text>
    </g>
    <!-- Движение прямо -->
    <g id="ahead">
      <circle r="30" fill="#2F6FE4" stroke="#fff" stroke-width="2.5"/>
      <path d="M0,-19 L13,-4 L5,-4 L5,19 L-5,19 L-5,-4 L-13,-4 Z" fill="#fff"/>
    </g>
    <!-- Главная дорога -->
    <g id="main">
      <rect x="-22" y="-22" width="44" height="44" transform="rotate(45)" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <rect x="-14" y="-14" width="28" height="28" transform="rotate(45)" fill="#F5C518"/>
    </g>
    <!-- Въезд запрещён -->
    <g id="noentry">
      <circle r="30" fill="#E5484D" stroke="#fff" stroke-width="2.5"/>
      <rect x="-20" y="-5.5" width="40" height="11" rx="1.5" fill="#fff"/>
    </g>
    <!-- Уступите дорогу -->
    <g id="yield">
      <polygon points="0,28 -32,-24 32,-24" fill="#fff" stroke="#E5484D" stroke-width="7" stroke-linejoin="round"/>
    </g>
    <!-- Пешеходный переход -->
    <g id="cross">
      <rect x="-28" y="-28" width="56" height="56" rx="6" fill="#2F6FE4" stroke="#fff" stroke-width="2.5"/>
      <polygon points="0,-21 21,15 -21,15" fill="#fff"/>
      <circle cx="1.5" cy="-5" r="3" fill="#111"/>
      <path d="M0.5,-1 L-2,8 M-1,3 L-6,7 M-1,3 L4,6 M-2,8 L-6,13 M-2,8 L3,13" stroke="#111" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    </g>
    <!-- Поворот направо -->
    <g id="right">
      <circle r="30" fill="#2F6FE4" stroke="#fff" stroke-width="2.5"/>
      <path d="M-8,18 L-8,0 Q-8,-6 -2,-6 L6,-6 L6,-14 L18,-1 L6,12 L6,4 L2,4 L2,18 Z" fill="#fff"/>
    </g>
  </defs>

  <use href="#stop"    transform="translate(60 60) rotate(-12)"/>
  <use href="#speed"   transform="translate(210 40) rotate(8)"/>
  <use href="#main"    transform="translate(360 80) rotate(-6)"/>
  <use href="#ahead"   transform="translate(130 170) rotate(14)"/>
  <use href="#warn"    transform="translate(290 190) rotate(-10)"/>
  <use href="#cross"   transform="translate(40 280) rotate(9)"/>
  <use href="#noentry" transform="translate(190 310) rotate(-14)"/>
  <use href="#yield"   transform="translate(360 300) rotate(12)"/>
  <use href="#right"   transform="translate(270 400) rotate(-4)"/>
  <use href="#speed"   transform="translate(100 410) rotate(-18) scale(0.8)"/>
  <use href="#stop"    transform="translate(420 200) rotate(16) scale(0.75)"/>
</svg>
